<header class="shadow-md p-3 w-full max-h-20 fixed top-0 z-50 bg-white">
    <div class="flex align-middle items-center justify-between max-w-screen-2xl mx-auto">
        <img routerLink="/" src="images/logo.png" alt="app logo" class="max-h-16">
        <nav class="flex gap-3 my-2 uppercase text-xl">
            <!--[routerLinkActiveOptions]="{exact: true} Asks "Is the current URL exactly /?"-->
            <a routerLink="/"
             routerLinkActive="active"
             [routerLinkActiveOptions]="{exact: true}"  
            >Home</a>

            <a routerLink="/shop" routerLinkActive="active">Shop</a>
            <a routerLink="/test-error" routerLinkActive="active">Errors</a>
            <a *appIsAdmin routerLink="/admin" routerLinkActive="active">Admin</a>
        </nav>

        <!-- align-middle probably redundant -->
        <div class="flex gap-3 align-middle items-center"> 
            <a routerLink="/cart"
            routerLinkActive="active"
             matBadge="{{cartService.itemCount()}}"
             class="custom-badge mt-2 mr-2">
                <mat-icon>shopping_cart</mat-icon>
            </a>
            @if (accountService.currentUser()) {
            <div  class="px-6">
                <button mat-button [matMenuTriggerFor]="menu">
                    <mat-icon>arrow_drop_down</mat-icon>
                    <span>{{accountService.currentUser()?.email}}</span>
                </button>
                <mat-menu #menu="matMenu" class="px-3">
                    <button mat-menu-item routerLink="/cart">
                        <mat-icon>shopping_cart</mat-icon>
                        My cart
                    </button>
                    <button mat-menu-item routerLink="/orders">
                        <mat-icon>history</mat-icon>
                        View Orders
                    </button>
                    <mat-divider></mat-divider>
                    <button mat-menu-item (click)="logout()">
                        <mat-icon>logout</mat-icon>
                        Logout</button>
                </mat-menu>
            </div>
            } @else {
            <button routerLink="account/login" mat-stroked-button>Login</button>
            <button routerLink="account/register" mat-stroked-button>Register</button>   
            }
                
        </div>
        
    </div>

</header>

<mat-progress-bar
    mode="indeterminate"
    class="fixed top-20 left-0 w-full z-50"
    [class.invisible]="!busyService.loading">
</mat-progress-bar>
<!-- 
  [class.invisible]      → Keep the progress bar in the DOM; Tailwind's invisible hides it without removing it
  fixed       → stays in place on scroll (position: fixed)
  top-0       → pinned to very top of screen
  z-50        → stacks above all page content (z-index: 50)
  max-h-20    → caps header height at 80px
  bg-white    → solid background so scrolled content doesn't show through
-->
