<!-- mt-32 removed: app.html already offsets for the fixed header. -->
<div class="mx-auto">
   <h2 class="font-semibold text-2xl mb-6 text-center">My orders</h2>
   <div class="flex flex-col">
     <!--
       overflow-x-auto: four columns plus a 'medium' date (e.g. "Sep 25, 2026, 3:04 PM")
       do not fit a 375px screen. Scrolling the table inside its own box is better than
       letting the whole page scroll sideways.
     -->
     <div class="w-full overflow-x-auto">
        <table class="min-w-full divide-y divide-gray-200 cursor-pointer">
            <thead class="bg-gray-50">
                <tr class="uppercase text-gray-600 text-sm">
                    <th class="text-center px-3 py-3 sm:px-6">Order</th>
                    <th class="text-left px-3 sm:px-6">Date</th>
                    <th class="text-left px-3 sm:px-6">Total</th>
                    <th class="text-left px-3 sm:px-6">Status</th>
                </tr>
            </thead>
            <tbody class="bg-white divide-y divide-gray-200">
                @for (order of orders; track order.id) {
                    <tr routerLink="/orders/{{order.id}}" class="hover:bg-gray-100">
                        <th class="px-3 py-3 sm:px-6"># {{order.id}}</th>
                        <td>{{order.orderDate | date: 'medium'}}</td>
                        <td>{{order.total | currency}}</td>
                        <td>{{order.status}}</td>
                    </tr>
                }
            </tbody>
        </table>
     </div>
   </div>
</div>
