<!--
  ===========================================================================
  HOME PAGE — ONE FULL-WIDTH HERO
  ===========================================================================
  This route has no product grid and no marketing sections below the fold: the
  whole page is a single photographic banner with a headline and a "Shop Now"
  button. That is a deliberate landing-page pattern.

  HOW THE LAYOUT WORKS:
  - `hero` is the background box. home.css makes it full-bleed (edge to edge),
    paints hero7.jpg into it with background-size: cover, and adds a white
    gradient overlay so the dark text stays readable over the photo.
  - `hero__inner` keeps the text aligned with the rest of the site's max width.
  - `hero__content` is the text block; its entrance animation is disabled for
    users who prefer reduced motion.

  HTML SEMANTICS:
  - <section> groups a meaningful part of the page.
  - aria-labelledby points the section at its own <h1>, which helps screen
    readers announce "Gear Up for the Slopes" as the page heading.
-->
<section class="hero px-10" aria-labelledby="hero-title">
  <div class="hero__inner">
    <div class="hero__content">
      <h1 id="hero-title" class="hero__title">
        Gear Up for<br />
        the <span class="hero__title-accent">Slopes</span>
      </h1>

      <p class="hero__subtitle">Premium ski gear. Greater adventures.</p>

      <a class="hero__cta" routerLink="/shop">
        <span>Shop Now</span>
        <svg class="hero__cta-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M5 12h14M13 6l6 6-6 6" />
        </svg>
      </a>
    </div>

    <!-- Carousel indicators are intentionally hidden for now. Re-enable this
         block when real carousel logic exists.
    <div class="hero__dots" role="group" aria-label="Hero slide 1 of 3">
      <span class="hero__dot hero__dot--active" aria-current="true"></span>
      <span class="hero__dot"></span>
      <span class="hero__dot"></span>
    </div>
    -->
  </div>
</section>
