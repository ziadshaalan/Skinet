<h2 mat-dialog-title>Update quantity in stock</h2>

<span></span>

<mat-dialog-content>
  <div class="flex gap-4 mt-6">
    <mat-form-field appearance="outline" class="flex">
      <mat-label>Quantity of {{data.name}}</mat-label>
      <input matInput min="0" type="number" [(ngModel)]="updatedQuantity">
    </mat-form-field>

    <button mat-flat-button class="min-h-14" [disabled]="!canUpdate" (click)="updateQuantity()">
      Update quantity
    </button>
  </div>
</mat-dialog-content>
