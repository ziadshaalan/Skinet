<div>
    <mat-tab-group>
        <mat-tab label="Orders">
            <!-- heading and status filter stack on phones instead of sharing one line -->
            <div class="flex flex-col items-start gap-2 mt-2 max-w-7xl mx-auto sm:flex-row sm:items-center sm:justify-between">
                <h2 class="text-2xl font-semibold">Customers orders</h2>
                <div class="w-full sm:w-auto">
                <mat-form-field appearance="outline" class="mt-2 w-full sm:w-auto">
                    <mat-label>Filter by status</mat-label>
                    <mat-select (selectionChange)="onFilterSelect($event)">
                        @for (status of statusOptions; track $index) {
                        <mat-option [value]="status">{{status}}</mat-option>
                        }
                    </mat-select>
                </mat-form-field>
                </div>
            </div>

            <div class="p-4">
                <div class="mat-shadow-2">
                    <!--
                      The orders table has 6 columns and does not fit a phone screen, so it
                      scrolls sideways inside its own box instead of dragging the whole page
                      sideways. The paginator sits outside this wrapper so it stays put.
                    -->
                    <div class="overflow-x-auto">
                    <table mat-table [dataSource]="dataSource">

                        <ng-container matColumnDef="id">
                            <th mat-header-cell *matHeaderCellDef> No. </th>
                            <td mat-cell *matCellDef="let order"> {{order.id}} </td>
                        </ng-container>

                        <ng-container matColumnDef="buyerEmail">
                            <th mat-header-cell *matHeaderCellDef> Buyer email </th>
                            <td mat-cell *matCellDef="let order"> {{order.buyerEmail}} </td>
                        </ng-container>

                        <ng-container matColumnDef="orderDate">
                            <th mat-header-cell *matHeaderCellDef> Date </th>
                            <td mat-cell *matCellDef="let order"> {{order.orderDate | date: 'short'}} </td>
                        </ng-container>

                        <ng-container matColumnDef="total">
                            <th mat-header-cell *matHeaderCellDef> Total </th>
                            <td mat-cell *matCellDef="let order"> {{order.total | currency}} </td>
                        </ng-container>

                        <ng-container matColumnDef="status">
                            <th mat-header-cell *matHeaderCellDef> Status </th>
                            <td mat-cell *matCellDef="let order"> {{order.status}} </td>
                        </ng-container>

                        <ng-container matColumnDef="action">
                            <th mat-header-cell *matHeaderCellDef> Actions </th>
                            <td mat-cell *matCellDef="let order">
                                <button mat-icon-button routerLink="/orders/{{order.id}}" matTooltip="View">
                                    <mat-icon class="visibility-icon">visibility</mat-icon>
                                </button>

                                <button mat-icon-button matTooltip="Refund"
                                (click)="openConfirmDialog(order.id)"
                                [disabled]="order.status === 'Refunded'"
                                >
                                    <mat-icon class="undo-icon">undo</mat-icon>
                                </button>
                            </td>
                        </ng-container>


                        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
                    </table>
                    </div>

                   <mat-paginator 
                        class="bg-white"
                        [pageSizeOptions]="[5, 10, 20]"
                        [length]="totalItems"
                        [pageSize]="orderParams.pageSize"
                        showFirstLastButtons
                        (page)="onPageChange($event)"
                    />
                </div>

            </div>
        </mat-tab>


    <mat-tab label="Catalog">
      <div class="p-4">Catalog content</div>
    </mat-tab>

    <mat-tab label="Other">
      <div class="p-4">Customer service</div>
    </mat-tab>
    
    </mat-tab-group>
</div>
