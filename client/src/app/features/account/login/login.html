<!--
  The account page is deliberately full-screen: the app shell hides the header
  for this route (see app.ts), and hero6.jpg runs edge to edge behind the form.
  A dark (but not black) gradient keeps the copy readable while the slopes stay
  visible, and the form itself floats on a translucent card so it stays the
  first thing the eye lands on.

  The page is the sign-in AND sign-up screen (email-first), so the left-hand copy
  speaks to new members - that is the primary path. On phones the copy is hidden
  and the form card becomes the only focal point.

  The page itself is the scroll container (login.css). The document never
  scrolls, so there is no white strip underneath the photo.
-->
<section class="auth-page" aria-label="Sign in or create an account">
  <div class="auth-page__scrim" aria-hidden="true"></div>

  <div class="auth-page__inner">
    <!-- Marketing copy is hidden on phones so the form is the first thing seen. -->
    <div class="auth-page__intro">
      <p class="auth-page__eyebrow">SkiNet membership</p>
      <h2 class="auth-page__headline">
        Fresh tracks.<br />
        <span>First access.</span>
      </h2>
      <p class="auth-page__lede">
        One account for the whole mountain: save your cart, follow every order
        and get through checkout faster next time.
      </p>

      <ul class="auth-page__points">
        <li>Save your cart across visits</li>
        <li>Track orders from dispatch to doorstep</li>
        <li>Check out in seconds on your next run</li>
      </ul>
    </div>

    <mat-card class="auth-card p-4 sm:p-8">
      <app-auth-form [returnUrl]="returnUrl" (authenticated)="onAuthenticated()" />
    </mat-card>
  </div>
</section>
