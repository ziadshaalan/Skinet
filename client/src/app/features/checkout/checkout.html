<!-- mt-32 removed: app.html already offsets for the fixed header. -->
<!--
  ===========================================================================
  CHECKOUT — FOUR-STEP WIZARD
  ===========================================================================
  Material's <mat-stepper> is the whole flow:
    Address -> Shipping -> Payment -> Confirmation

  IMPORTANT UI TERMS:
  - `[linear]="true"` means the user cannot jump ahead until the current step is
    complete. Each step's `[completed]` binding is what unlocks the next one.
  - `[orientation]` is responsive: horizontal on wide screens, vertical on phones.
  - `#stepper` is a template reference variable. It gives the TypeScript class a
    handle on this stepper, so confirmPayment(stepper) can move it after payment.
  - `<div id="address-element">` and `<div id="payment-element">` are empty boxes
    on purpose. Stripe's JavaScript mounts its own card/address form inside them;
    we never write those fields ourselves.

  LAYOUT:
  The 3/4 + 1/4 row is the same pattern as the cart page. On phones both blocks
  stack, so the order summary stays readable.
-->
<div class="flex flex-col gap-6 lg:flex-row">
    <div class="w-full lg:w-3/4">
        <mat-stepper 
        (selectionChange)="onStepChange($event)"
         #stepper
         [linear]="true"
         [orientation]="stepperOrientation()"
         class="bg-white border border-gray-200 shadow-sm">
            <mat-step label="Address" [completed]="completionStatus().address">
                <div id="address-element"></div>
                <div class="flex justify-end mt-1">
                    <mat-checkbox
                    [checked]="saveAddress"
                    (change)="onSaveAddressCheckboxChange($event)"
                    >
                        Save as default address
                    </mat-checkbox>
                </div>
                <div class="flex flex-wrap justify-between gap-2 mt-6">
                    <button class="z-0" routerLink="/shop" mat-stroked-button>Continue shopping</button>
                    <button
                    [disabled]="!completionStatus().address"
                     class="z-0" matStepperNext mat-flat-button>Next</button>
                </div>
            </mat-step>
             <mat-step label="Shipping" [completed]="completionStatus().delivery">
                <app-checkout-delivery (deliveryComplete)="handleDeliveryChange($event)"></app-checkout-delivery>
                <div class="flex flex-wrap justify-between gap-2 mt-6">
                    <button matStepperPrevious mat-stroked-button>Back</button>
                    <button
                    [disabled]="!completionStatus().delivery"
                     matStepperNext mat-flat-button>Next</button>
                </div>
                
            </mat-step>
             <mat-step label="Payment" [completed]="completionStatus().card">
                <div id="payment-element"></div>
               <div class="flex flex-wrap justify-between gap-2 mt-6">
                    <button matStepperPrevious mat-stroked-button>Back</button>
                    <button
                    [disabled]="!completionStatus().card"
                     matStepperNext mat-flat-button >Next</button>
                </div>
            </mat-step>
             <mat-step label="Confirmation">
                <app-checkout-review [confirmationToken]="confirmationToken"></app-checkout-review>
                   <div class="flex flex-wrap justify-between gap-2 mt-6">
                    <button matStepperPrevious mat-stroked-button>Back</button>
                    <button
                    [disabled]="!confirmationToken || loading"
                     (click)="confirmPayment(stepper)"mat-flat-button>
                        @if (this.loading) {
                        <mat-spinner diameter="20"></mat-spinner>
                        } @else {
                        <span>Pay {{this.cartService.totals()?.total |currency}}</span>
                        }
                    </button>
                </div>
            </mat-step>
        </mat-stepper>
    </div>
    <div class="w-full lg:w-1/4">
        <app-order-summary></app-order-summary>
    </div>
</div>
