<!--
  ===========================================================================
  SHOP PAGE — SEARCH, FILTERS, SORT AND THE PRODUCT GRID
  ===========================================================================
  Read this with shop.ts.

  THE LAYOUT:
  - `flex flex-col gap-3 lg:flex-row`: on phones the toolbar controls stack;
    from `lg` up they sit in one row (paginator left, search centre, buttons right).
  - the product area is a CSS grid: 2 columns on phones, then 3 / 4 / 5 as the
    screen gets wider. Grid keeps every row aligned automatically.
  - each cell is one <app-product-item>, which receives its product through
    `[product]="product"`.

  THE CONTROLS:
  - search: `(ngModelChange)` fires on every keystroke; shop.ts debounces those
    keystrokes so the API is not called 20 times for a 20-letter search.
  - filters: opens a Material dialog. The dialog returns the chosen brands and
    types, then the shop reloads page 1.
  - sort: a Material menu linked to the button with `[matMenuTriggerFor]`.
    `[selected]` pre-highlights the option that is currently active.

  WHY THE EMPTY STATE IS SEPARATE:
  `@if (products.count > 0)` keeps the toolbar hidden when there is nothing to
  show; the visitor sees one clear "No products match this filter" action instead
  of a broken-looking empty grid.
-->
@if (products && products.count > 0) {
<div class="flex flex-col gap-3">
  <!--
    Three direct children of this flex row so that the desktop arrangement is
    unchanged (paginator left, search centre, buttons right) while phones simply
    stack them into three full-width rows. flex-col on mobile, flex-row from lg up.
  -->
  <div class="flex flex-col gap-3 lg:flex-row lg:items-center lg:justify-between">

    <!--(page)="handlePageEvent($event)" listens to paginator event and sends PageEvent to component -->
    <mat-paginator
    (page)="handlePageEvent($event)"
    [pageIndex]="shopParams.pageNumber - 1"
    [pageSize]="shopParams.pageSize"
    [length]="products.count"
    [pageSizeOptions]="pageSizeOptions"
    [showFirstLastButtons]="true"
    aria-label="Select page"
    >
    </mat-paginator>

    <!-- removed (ngSubmit) — form no longer triggers search on Enter/button click -->
    <!-- w-full on phones (was a fixed max-w-md + mx-4 = 480px, wider than a 375px screen) -->
    <form #searchForm="ngForm" class="relative flex w-full items-center lg:mx-4 lg:max-w-md">
      <input
          type="search"
          class="block w-full p-3 text-sm text-gray-900 border border-gray-300 rounded-lg bg-gray-50 focus:border-blue-500"
          placeholder="Search"
          name="search"
          [(ngModel)]="shopParams.search"
          (ngModelChange)="onSearchChange()" />
        <!-- (ngModelChange) — fires onSearchChange() on every keystroke instead of form submit -->
          <!-- type changed from "submit" to "button" — no longer submits the form -->
      <mat-icon class="absolute right-3 top-3 text-gray-500">search</mat-icon>
    </form>

    <!--
      Wrapper div carries the responsive classes because Material's own button styles
      outrank Tailwind's single-class utilities — see the note at the top of header.html.
    -->
    <div class="flex w-full gap-2 lg:w-auto lg:gap-3">
      <button mat-stroked-button (click)="openFiltersDialog()">
        <mat-icon>filter_list</mat-icon>
        Filters
      </button>
      <!-- Button that opens the menu -->
      <!-- [matMenuTriggerFor] links this button to #sortMenu below -->
      <button mat-stroked-button [matMenuTriggerFor]="sortMenu">
        <mat-icon>swap_vert</mat-icon>
        Sort
      </button>
    </div>
  </div>

  <!--
    Was a hard-coded grid-cols-5: on a 375px phone that is ~65px per card, so the
    images were crushed and the "Add to cart" text overflowed the card.
    Mobile-first: 2 columns on phones, scaling up to the original 5 on wide screens.
  -->
  <div class="grid grid-cols-2 gap-3 sm:grid-cols-3 sm:gap-4 md:grid-cols-4 xl:grid-cols-5">
    @for (product of products.data; track product.id) {
      <app-product-item [product]="product"></app-product-item>
    }
</div>
</div>
<!--(#) is a template reference variable — it gives a name to an element so you can reference it elsewhere in the same template.-->
<mat-menu #sortMenu = "matMenu">
  <mat-selection-list [multiple]="false"  #sortList (selectionChange)="onSortChange($event)">
    @for (sort of sortOptions; track $index) {
      <!-- [value]="sort.value" = what gets stored when selected -->
      <!-- [selected]="selectedSort === sort.value" = pre-checks the active option -->
      <mat-list-option [value]="sort.value" [selected]="this.shopParams.sort === sort.value">
        {{sort.name}}
      </mat-list-option>
    }
  </mat-selection-list>

</mat-menu>


}
@else {
  <app-empty-state
    message="No products match this filter"
    icon="filter_alt_off"
    actionText="Reset filters"
    (action)="resetFilters()"
   />
}
