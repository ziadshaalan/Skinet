<!-- shopService.brands → populates the visible list -->
<!-- [(ngModel)]="selectedBrands" → two-way bind to FiltersDialog.selectedBrands -->
<!-- [value]="brand" → what gets stored when option is checked -->


<!--
  ===========================================================================
  FILTERS DIALOG — BRANDS AND TYPES
  ===========================================================================
  This template is opened as a Material dialog from the shop page. It receives
  the shop's current selections through `data`, edits local copies, and returns
  them when "Apply Filters" is pressed.

  `[(ngModel)]` with `[multiple]="true"` means the selection list writes an
  ARRAY of chosen values, which is exactly the shape the shop expects.
  `[value]="brand"` decides what goes into that array (the brand name itself).

  The dialog is not a route: it overlays the shop, so closing it returns the
  user to the grid they were already looking at.
-->
<div>
    <h3 class="text-3xl text-center pt-6 mb-3">Filters</h3>
    <mat-divider></mat-divider>
    <!-- Was always two side-by-side halves; stacked on phones, side by side from sm up. -->
    <div class="flex flex-col p-4 sm:flex-row">
        <div class="w-full sm:w-1/2">
            <h4 class="font-semibold text-xl text-primary">Brands</h4>
            <mat-selection-list [(ngModel)]="selectedBrands" [multiple]="true">
                @for (brand of shopService.brands; track $index) {
                    <mat-list-option [value]="brand">{{brand}}</mat-list-option>
                }
            </mat-selection-list>
        </div>

        <div class="w-full sm:w-1/2">
            <h4 class="font-semibold text-xl text-primary">Types</h4>
            <mat-selection-list [(ngModel)]="selectedTypes" [multiple]="true">
                @for (type of shopService.types; track $index) {
                    <mat-list-option [value]="type">{{type}}</mat-list-option>
                }
            </mat-selection-list>
        </div>
    </div>

    <div class="flex justify-end p-4">
        <button mat-flat-button (click)="applyFilters()">Apply Filters</button>
    </div>
</div>
