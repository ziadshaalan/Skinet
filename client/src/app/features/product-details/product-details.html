@if (product) {
    <section class="py-8">
        <div class="max-w-[1536px] px-4 mx-auto">
            <!--
              Back to shop, top right.

              routerLink is used rather than history.back() on purpose: if someone opens a
              product URL directly (or refreshes), there is no in-app history to go back to
              and history.back() would leave the site entirely. A link always has a
              meaningful destination.

              justify-end on mobile too, so the button stays in the top-right corner
              instead of dropping below the title on narrow screens.
            -->
            <div class="flex justify-end mb-4">
                <button mat-stroked-button routerLink="/shop">
                    <mat-icon>arrow_back</mat-icon>
                    Back to shop
                </button>
            </div>

            <!-- Was grid-cols-2: side by side on a 375px phone left ~165px for the image
                 and ~165px for the details. Stacked on phones, side by side from lg up. -->
            <div class="grid grid-cols-1 gap-4 lg:grid-cols-2 lg:gap-8">
                <div class="max-w-xl mx-auto overflow-hidden rounded-lg" >
                    <img
                      class="w-full"
                      src="{{product.pictureUrl}}"
                      alt="product image"

                      >
                </div>

                <div>
                    <h1 class="text-2xl font-semibold text-gray-900">{{product.name}}</h1>

                     <p>You have {{quantityInCart}} of this item in your cart</p>

                    <div class="mt-4 items-center gap-4 flex">
                        <p class="text-3xl font-extrabold text-gray-900">
                            {{product.price | currency}}
                        </p>
                    </div>


                    <!-- flex-wrap so the quantity field drops below the button on narrow screens -->
                    <div class="flex flex-wrap gap-4 mt-6">
                        <button (click)="updateCart()"
                         mat-flat-button
                          [disabled]="quantity === quantityInCart"  
                          class="min-h-14">
                            <mat-icon>shopping_cart</mat-icon>
                            {{getButtonText()}}
                        </button>
                        


                        <!-- [(ngModel)] = two-way binding: typing here updates `quantity` live, and vice versa.
                        Requires FormsModule imported in the component. -->
                        <mat-form-field appearance="outline" class="flex">
                            <mat-label>Quantity</mat-label>
                            <input matInput min="0" type="number" [(ngModel)] ="quantity">
                        </mat-form-field>
                    </div>

                        <mat-divider></mat-divider>

                     <p class="mt-6 text-gray-500">
                        {{product.description}}
                    </p>

                </div>
            </div>
        </div>

    </section>
}
