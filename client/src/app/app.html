<!--
  ===========================================================================
  THE APP SHELL
  ===========================================================================
  Read this together with app.ts.

  NORMAL PAGES (home, shop, cart, checkout, orders, admin):
    header is visible, and the page sits inside `.container` with a top margin
    that clears the fixed header.

  ACCOUNT PAGES (/account/login and /account/register):
    the header is hidden and the container/margins are removed. The page then
    fills the viewport itself, which is what makes the hero6.jpg background
    edge-to-edge with no white strip underneath.

  The `@if` and `[class]` below are the only difference between the two layouts.
-->

@if (!isAuthPage()) {
  <app-header></app-header>
}

<!--
  [class] replaces the whole class attribute based on the route:
    auth-outlet  -> 100dvh box, no header offset, no page scrolling
    container... -> the usual centered page with `mt-20 lg:mt-24` below the header
-->
<div [class]="isAuthPage() ? 'auth-outlet' : 'container mt-20 lg:mt-24'">
    <router-outlet></router-outlet>
</div>

<!--
  MINI-CART DRAWER — rendered once here, at the ROOT of the app, on purpose:
  "Add to cart" can be clicked from the shop grid OR from a product details
  page, so the drawer has to exist on every route. It is position:fixed (see
  mini-cart.css), so its DOM position here does not affect where it shows up
  on screen — it lives here only so Angular keeps a single instance of it
  alive for the whole session. Visibility is controlled by MiniCartService.
-->
<app-mini-cart></app-mini-cart>
